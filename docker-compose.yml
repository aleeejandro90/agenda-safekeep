services:
    laravel.test:
        # Quitamos "image" y ponemos "build" para que use nuestro Dockerfile personalizado
        build:
            context: .
            dockerfile: Dockerfile
        container_name: agenda_app
        ports:
            - '8080:8000'
        volumes:
            - '.:/var/www/html'
        working_dir: /var/www/html
        entrypoint: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
        networks:
            - sail
        depends_on:
            - mysql

    mysql:
        image: 'mysql/mysql-server:8.0'
        container_name: agenda_db
        ports:
            - '3306:3306'
        environment:
            MYSQL_ROOT_PASSWORD: 'password'
            MYSQL_DATABASE: 'agenda'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
        networks:
            - sail

networks:
    sail:
        driver: bridge

volumes:
    sail-mysql:
        driver: local